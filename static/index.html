<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Q&A Chatbot</title>
<style>
body { font-family: Arial; background: #f1f2f7; padding: 20px; }
.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  height: 90vh;
}
#chatBox {
  flex-grow: 1;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 15px;
  overflow-y: auto;
  background: #fafafa;
  margin: 15px 0;
}
.message { margin: 10px 0; padding: 10px; border-radius: 10px; max-width: 80%; }
.user { background: #d1e7dd; float: right; }
.bot { background: #e2e3e5; float: left; }
.input-area { display: flex; gap: 10px; }
button { padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; }
input { flex: 1; padding: 10px; }
</style>
</head>
<body>

<div class="container">
<h2>PDF / DOCX / IMG Chatbot</h2>

<form id="uploadForm">
  <input type="file" id="fileInput" required>
  <button type="submit">Upload</button>
</form>

<div id="chatBox"></div>

<form id="askForm">
  <div class="input-area">
    <input type="text" id="questionInput" placeholder="Ask a question..." required>
    <button type="submit">Ask</button>
  </div>
  <button type="button" onclick="resetChat()">Reset Chat</button>
</form>
</div>

<script>
let sessionId = null;

const uploadForm = document.getElementById("uploadForm");
const askForm = document.getElementById("askForm");
const chatBox = document.getElementById("chatBox");
const questionInput = document.getElementById("questionInput");

uploadForm.addEventListener("submit", async e => {
  e.preventDefault();
  const formData = new FormData();
  formData.append("file", document.getElementById("fileInput").files[0]);

  appendMessage("Uploading file...", "bot");

  const res = await fetch("/upload", { method: "POST", body: formData });
  const data = await res.json();

  if (data.session_id) {
    sessionId = data.session_id;
    appendMessage("File uploaded. Ask questions now.", "bot");
  } else {
    appendMessage(data.error, "bot");
  }
});

askForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!sessionId) {
    appendMessage("Upload a file first.", "bot");
    return;
  }

  const question = questionInput.value.trim();
  if (!question) return;

  appendMessage(question, "user");
  questionInput.value = "";

  const formData = new FormData();
  formData.append("session_id", sessionId);
  formData.append("question", question);

  const thinking = appendMessage("Thinking...", "bot");

  const res = await fetch("/ask", { method: "POST", body: formData });
  const data = await res.json();
  thinking.textContent = data.answer || data.error;
});

async function resetChat() {
  if (!sessionId) return;
  const formData = new FormData();
  formData.append("session_id", sessionId);

  const res = await fetch("/reset", { method: "POST", body: formData });
  const data = await res.json();
  chatBox.innerHTML = "";
  appendMessage(data.message, "bot");
}

function appendMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
</script>

</body>
</html>
